<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بلاك ستور | Black Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400;600&family=Changa:wght@300;400;600&family=Reem+Kufi:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{font-family: var(--store-font, 'Cairo');}
.gold-glow{box-shadow:0 0 0 1px rgba(212,175,55,0.2), 0 0 40px rgba(212,175,55,0.15), 0 20px 60px rgba(0,0,0,0.6)}
.card-hover{transition:all .4s cubic-bezier(.16,1,.3,1)}
.card-hover:hover{transform:translateY(-6px) scale(1.01); box-shadow:0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(212,175,55,0.15)}
.status-dot{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
</style>
</head>
<body id="body" class="min-h-screen antialiased selection:bg-[#D4AF37]/30">
<!-- Header -->
<header class="pt-16 pb-10 px-6 flex flex-col items-center">
  <div id="logoWrap" class="relative w-[160px] h-[160px] rounded-full p-[2px] gold-glow" style="background:linear-gradient(135deg,#D4AF37,#8B7320)">
    <div class="w-full h-full rounded-full bg-[#0A0A0A] flex items-center justify-center overflow-hidden">
      <img id="logoImg" class="w-full h-full object-cover hidden" />
      <span id="logoFallback" class="text-[48px] font-[300] tracking-[8px] text-[#D4AF37]">BS</span>
    </div>
  </div>
  <h1 id="storeName" class="mt-8 text-[42px] md:text-[56px] font-[300] tracking-[0.08em] leading-none">بلاك ستور</h1>
  <p class="mt-3 text-[13px] tracking-[0.25em] opacity-60">متجر الهدايا الفاخرة</p>
  <a id="waBtn" href="#" target="_blank" class="mt-10 group inline-flex items-center gap-3 h-[52px] px-8 rounded-full font-bold text-[14px] transition-all hover:scale-[1.03] active:scale-[0.98]" style="background:linear-gradient(135deg,#D4AF37,#F0D878); color:#000; box-shadow:0 10px 30px rgba(212,175,55,0.35)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.55 4.107 1.51 5.84L0 24l6.33-1.66A11.94 11.94 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.85 0-3.58-.5-5.07-1.37l-.36-.21-3.76.99.99-3.66-.23-.38A9.9 9.9 0 012 12c0-5.514 4.486-10 10-10s10 4.486 10 10-4.486 10-10 10zm5.46-7.5c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.79-1.68-2.09-.18-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.49 1.7.63.71.22 1.36.19 1.87.12.57-.08 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z"/></svg>
    <span>تواصل عبر واتساب</span>
  </a>
</header>

<main class="max-w-[1240px] mx-auto px-5 md:px-8 pb-20">
  <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  <div id="emptyState" class="hidden text-center py-20 opacity-50">لا يوجد منتجات حالياً</div>
</main>

<footer class="py-10 text-center text-[11px] tracking-widest opacity-40">© بلاك ستور — BLACK STORE — جميع الحقوق محفوظة</footer>

<script>
const DEFAULT_DATA = {
  logo: '',
  name: 'بلاك ستور',
  whatsapp: '201000000000',
  colors: {bg:'#0A0A0A', cardBg:'#151515', accent:'#D4AF37', text:'#FFFFFF', muted:'#9A9A9A'},
  font: 'Cairo',
  products: [
    {id:1, name:'Love Gift', price:'299 جنيه', previewUrl:'https://example.com', availability:'متوفر الآن', bgImage:'https://picsum.photos/seed/love/600/800'},
    {id:2, name:'HBD', price:'450 جنيه', previewUrl:'https://example.com', availability:'سيتوفر قريبا', bgImage:'https://picsum.photos/seed/hbd/600/800'},
    {id:3, name:'Anniversary', price:'520 جنيه', previewUrl:'https://example.com', availability:'متوفر الآن', bgImage:'https://picsum.photos/seed/ann/600/800'}
  ]
};

const FONT_MAP = {
  'Cairo': "'Cairo', sans-serif",
  'Tajawal': "'Tajawal', sans-serif",
  'Amiri': "'Amiri', serif",
  'IBM Plex Sans Arabic': "'IBM Plex Sans Arabic', sans-serif",
  'Changa': "'Changa', sans-serif",
  'Reem Kufi': "'Reem Kufi', sans-serif"
};

function loadData(){
  try{
    const saved = localStorage.getItem('blackstore_v2');
    if(saved){
      const p = JSON.parse(saved);
      return {...DEFAULT_DATA, ...p, colors:{...DEFAULT_DATA.colors, ...(p.colors||{})}, products: p.products?.length ? p.products : DEFAULT_DATA.products};
    }
  }catch(e){}
  return DEFAULT_DATA;
}

function render(){
  const data = loadData();
  const body = document.getElementById('body');
  body.style.background = data.colors.bg;
  body.style.color = data.colors.text;
  body.style.setProperty('--store-font', FONT_MAP[data.font] || "'Cairo'");
  
  document.getElementById('storeName').textContent = data.name || 'بلاك ستور';
  document.getElementById('storeName').style.fontFamily = FONT_MAP[data.font];
  
  const logoImg = document.getElementById('logoImg');
  const logoFallback = document.getElementById('logoFallback');
  if(data.logo){
    logoImg.src = data.logo;
    logoImg.classList.remove('hidden');
    logoFallback.classList.add('hidden');
  }else{
    logoImg.classList.add('hidden');
    logoFallback.classList.remove('hidden');
  }
  
  const wa = (data.whatsapp||'').replace(/[^0-9]/g,'');
  document.getElementById('waBtn').href = `https://wa.me/${wa}`;
  document.getElementById('waBtn').style.background = `linear-gradient(135deg, ${data.colors.accent}, #F0D878)`;
  
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';
  if(!data.products.length){
    document.getElementById('emptyState').classList.remove('hidden');
    return;
  }
  document.getElementById('emptyState').classList.add('hidden');
  
  data.products.forEach(prod=>{
    const isAvailable = prod.availability === 'متوفر الآن';
    const statusColor = isAvailable ? '#10B981' : '#F59E0B';
    const card = document.createElement('div');
    card.className = 'card-hover relative h-[420px] rounded-[28px] overflow-hidden border';
    card.style.background = data.colors.cardBg;
    card.style.borderColor = 'rgba(255,255,255,0.06)';
    card.innerHTML = `
      <div class="absolute inset-0">
        <img src="${prod.bgImage}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://picsum.photos/seed/${prod.id}/600/800'" />
        <div class="absolute inset-0" style="background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 35%, rgba(0,0,0,0.05) 100%)"></div>
      </div>
      <div class="absolute top-0 right-0 bottom-0 w-[4px]" style="background:${statusColor}"></div>
      <div class="absolute top-4 left-4 flex items-center gap-2">
        <div class="flex items-center gap-2 h-[28px] px-3 rounded-full text-[11px] font-bold" style="background:${statusColor}; color:#000">
          <span class="w-[6px] h-[6px] rounded-full bg-black status-dot"></span>
          ${prod.availability}
        </div>
      </div>
      <div class="absolute bottom-0 left-0 right-0 p-6">
        <div class="flex items-end justify-between gap-3 mb-4">
          <h3 class="text-[26px] font-[600] leading-none tracking-wide">${prod.name||'بدون اسم'}</h3>
          <span class="shrink-0 text-[12px] font-bold px-3 py-1 rounded-full border" style="color:${data.colors.accent}; border-color:${data.colors.accent}40; background:${data.colors.accent}15">${prod.price||''}</span>
        </div>
        <button onclick="window.open('${prod.previewUrl||'#'}','_blank')" class="w-full h-[48px] rounded-full backdrop-blur-[12px] border bg-white/[0.08] border-white/[0.12] text-white text-[13px] font-bold tracking-wide hover:bg-white/[0.14] transition-colors">
          معاينة — ${prod.name||'الموقع'}
        </button>
      </div>
    `;
    grid.appendChild(card);
  });
}

render();
window.addEventListener('storage', render);
// live update if same tab admin saves
setInterval(()=>{ const cur = localStorage.getItem('blackstore_v2'); if(window._lastStore !== cur){ window._lastStore = cur; render(); } }, 800);
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
